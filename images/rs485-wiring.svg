<svg xmlns="http://www.w3.org/2000/svg" width="680" height="584" viewBox="0 0 680 584" role="img" aria-labelledby="title desc">
  <title id="title">RS-485 bus wiring for Plum ecoMAX</title>
  <desc id="desc">Two supported options wire identically through the A, B, and GND adapter or bridge pins to the green ecoMAX RS-485 terminal block (+12V, D+, D-, GND): a USB-to-RS-485 adapter (/dev/ttyUSB0, 9600 to 115200 baud) or an RS-485-to-TCP bridge (socket://host:port, Elfin-EW11 or USR-TCP232). Wire A to D+ and B to D- over one twisted pair, with optional GND to GND, leaving +12V on the left unconnected.</desc>
  <style>
    :root {
      --card: #F8FAFC; --card-edge: #CBD5E1;
      --ink: #0F172A; --ink2: #334155; --ink3: #475569; --hair: #64748B;
      --a: #D97706; --a-ink: #B45309; --a-soft: #FEF3C7;
      --b: #0284C7; --b-ink: #0369A1; --b-soft: #E0F2FE;
      --g: #64748B; --g-ink: #334155; --g-soft: #E2E8F0;
      --teal: #0F766E; --plum: #68478D;
      --housing: #E2E8F0; --housing-edge: #94A3B8;
      --green-dim: #A7D7B8; --label: #FFFFFF; --label-edge: #94A3B8;
      --wire-edge: #0F172A; --dev: #1E293B; --dev-edge: #0F172A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: #161B22; --card-edge: #30363D;
        --ink: #F0F6FC; --ink2: #C9D1D9; --ink3: #9EA7B3; --hair: #8B949E;
        --a: #F59E0B; --a-ink: #FBBF24; --a-soft: #3A2508;
        --b: #41BDF5; --b-ink: #7DD3FC; --b-soft: #0C2A42;
        --g: #8B949E; --g-ink: #D0D7DE; --g-soft: #21262D;
        --teal: #2DD4BF; --plum: #FFFFFF;
        --housing: #21262D; --housing-edge: #484F58;
        --green-dim: #1F4A33; --label: #161B22; --label-edge: #484F58;
        --wire-edge: #010409; --dev: #262C36; --dev-edge: #57606A;
      }
    }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .card { fill: var(--card); stroke: var(--card-edge); }
    .ink { fill: var(--ink); } .ink2 { fill: var(--ink2); } .ink3 { fill: var(--ink3); }
    .a-ink { fill: var(--a-ink); } .b-ink { fill: var(--b-ink); } .g-ink { fill: var(--g-ink); }
    .plum { fill: var(--plum); }
    .hair { fill: none; stroke: var(--hair); }
    .net { stroke: var(--teal); }
    .chip-a { fill: var(--a-soft); stroke: var(--a); }
    .chip-b { fill: var(--b-soft); stroke: var(--b); }
    .chip-g { fill: var(--g-soft); stroke: var(--g); }
    .chip-n { fill: var(--label); stroke: var(--hair); }
    .ring-a { stroke: var(--a); } .ring-b { stroke: var(--b); } .ring-g { stroke: var(--g); }
    .core-a { stroke: var(--a); } .core-b { stroke: var(--b); } .core-g { stroke: var(--g); }
    .wire-edge { stroke: var(--wire-edge); }
    .dev { fill: var(--dev); stroke: var(--dev-edge); }
    .housing { fill: var(--housing); stroke: var(--housing-edge); }
    .green-dim { fill: var(--green-dim); }
    .label { fill: var(--label); stroke: var(--label-edge); }
    .t-h { font-size: 16.5px; font-weight: 700; }
    .t-b { font-size: 14px; }
    .t-m { font-size: 13.5px; }
    .t-pin { font-size: 15px; font-weight: 700; }
    .t-map { font-size: 16.5px; font-weight: 700; }
    .led { animation: blink 1.6s ease-in-out infinite; }
    .led2 { animation: blink 1.6s ease-in-out 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .led, .led2 { animation: none; }
    }
  </style>
