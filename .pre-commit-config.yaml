---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: "builtin"
    hooks:
      - id: check-json
        exclude: (.vscode|tests/)
  - repo: local
    hooks:
      - id: sync-translations
        name: sync translations
        entry: python scripts/sync_translations.py --sort
        language: system
        pass_filenames: false
        files: ^custom_components/plum_ecomax/(strings\.json|translations/.*\.json)$
